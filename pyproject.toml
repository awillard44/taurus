[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taurus"
version = "0.1.0"
description = "Experimental adaptive market intelligence system"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2",
    "gymnasium>=1.0",
    "stable-baselines3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

